<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lifting Log</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 16px; }
    input, select { font-size: 16px; padding: 10px; width: 100%; margin: 8px 0; }
    .row { padding: 10px 0; border-bottom: 1px solid #ddd; }
    .muted { color: #666; font-size: 14px; }
    .big { font-size: 18px; }
    .pill { display:inline-block; padding:2px 8px; border:1px solid #ccc; border-radius:999px; font-size:12px; margin-left:6px; }
  </style>
</head>
<body>
  <h2 style="margin: 0 0 8px 0;">Lifting Log</h2>
  <div class="muted">Loads <code>logs.csv</code> from this site.</div>

  <input id="q" placeholder="Search exercise (e.g. bench, squat, OHP)..." autocomplete="off" />

  <select id="exerciseSelect">
    <option value="">Choose an exercise…</option>
  </select>

  <select id="noteASelect">
    <option value="">Filter type…</option>
  </select>

  <div id="summary" style="margin: 12px 0;"></div>
  <div id="results"></div>

  <script>
    function parseCSV(text) {
      const rows = [];
      let row = [], field = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], n = text[i + 1];
        if (c === '"') {
          if (inQuotes && n === '"') { field += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (c === ',' && !inQuotes) {
          row.push(field); field = "";
        } else if ((c === '\n' || c === '\r') && !inQuotes) {
          if (c === '\r' && n === '\n') i++;
          row.push(field); field = "";
          if (row.some(x => x.length)) rows.push(row);
          row = [];
        } else {
          field += c;
        }
      }
      row.push(field);
      if (row.some(x => x.length)) rows.push(row);
      return rows;
    }

    const norm = (s) => (s ?? "").toString().trim();
    const normKey = (s) => norm(s).toLowerCase();

    function escapeHtml(s) {
      return (s ?? "").toString()
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function toIntStrict(x) {
      const s = norm(x);
      if (!s) return NaN;
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }

    function toIntOrNegInf(x) {
      const n = toIntStrict(x);
      return Number.isFinite(n) ? n : -Infinity;
    }

    function parseDateLoose(dateStr) {
      const d = norm(dateStr);
      if (!d) return null;

      // YYYY-MM-DD
      let m = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));

      // DD.MM.YYYY or DD/MM/YYYY
      m = d.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
      if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));

      const t = Date.parse(d);
      if (!Number.isNaN(t)) return new Date(t);

      return null;
    }

    function formatDateDisplay(dateStr) {
      const dt = parseDateLoose(dateStr);
      if (!dt) return norm(dateStr);
      const s = new Intl.DateTimeFormat("en-GB", {
        day: "2-digit",
        month: "short",
        year: "2-digit"
      }).format(dt); // "01 Feb 26"
      return s.replaceAll(" ", "-"); // "01-Feb-26"
    }

    let entries = [];

    function renderExerciseOptions() {
      const ex = [...new Set(entries.map(e => e.Exercise))]
        .filter(Boolean)
        .sort((a,b) => a.localeCompare(b));

      const sel = document.getElementById("exerciseSelect");
      sel.innerHTML =
        `<option value="">Choose an exercise…</option>` +
        ex.map(x => `<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join("");
    }

    function renderNoteAOptions() {
      const values = [...new Set(entries.map(e => norm(e.NoteA)))]
        .filter(v => v !== "")
        .sort((a,b) => a.localeCompare(b));

      const sel = document.getElementById("noteASelect");
      sel.innerHTML =
        `<option value="">Filter type (any)…</option>` +
        values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    }

        function formatEntry(e) {
      const note = [norm(e.NoteA), norm(e.NoteB)].filter(Boolean).join(" · ");
      const notePill = note ? ` <span class="pill">${escapeHtml(note)}</span>` : "";
      const dateShown = formatDateDisplay(e.Date);

      const metaParts = [
        norm(e.Exercise),
        norm(e.WorkoutLabel),
        norm(e.SetID) ? `Set ${norm(e.SetID)}` : "",
      ].filter(Boolean);

      return `
        <div class="row">
          <div class="big">${escapeHtml(dateShown)} — ${escapeHtml(e.Weight_kg)} kg × ${escapeHtml(e.Reps)}${notePill}</div>
          <div class="muted">${escapeHtml(metaParts.join(" · "))}</div>
        </div>
      `;
    }


    function summarize(list) {
      const s = document.getElementById("summary");
      if (!list.length) { s.innerHTML = ""; return; }

      const latest = list[0];
      const best = list.reduce((acc, e) => {
        const w = Number(norm(e.Weight_kg).replace(",", "."));
        if (Number.isFinite(w) && w > acc.w) return { w, e };
        return acc;
      }, { w: -Infinity, e: null });

      const latestLine = `${escapeHtml(latest.Exercise)} latest: ${escapeHtml(latest.Weight_kg)} kg × ${escapeHtml(latest.Reps)} on ${escapeHtml(formatDateDisplay(latest.Date))}`;
      const bestLine = best.e ? `Heaviest logged: ${escapeHtml(String(best.w))} kg (on ${escapeHtml(formatDateDisplay(best.e.Date))})` : "";

      s.innerHTML = `<div style="padding:10px; border:1px solid #ddd; border-radius:12px;">
        <div>${latestLine}</div>
        ${bestLine ? `<div class="muted" style="margin-top:6px;">${bestLine}</div>` : ""}
      </div>`;
    }

    function applyFilter() {
      const q = normKey(document.getElementById("q").value);
      const chosenExercise = norm(document.getElementById("exerciseSelect").value);
      const chosenNoteA = norm(document.getElementById("noteASelect").value);

      let list = entries;

      if (chosenExercise) {
        list = list.filter(e => e.Exercise === chosenExercise);
      } else if (q) {
        list = list.filter(e => normKey(e.Exercise).includes(q));
      }

      if (chosenNoteA) {
        list = list.filter(e => norm(e.NoteA) === chosenNoteA);
      }

      list = list.slice().sort((a, b) => {
        // 1) Date desc
        const dA = parseDateLoose(a.Date);
        const dB = parseDateLoose(b.Date);
        const tA = dA ? dA.getTime() : -Infinity;
        const tB = dB ? dB.getTime() : -Infinity;
        if (tA !== tB) return tB - tA;
      
        // 2) WorkoutID desc (session ordering within the day)
        const wA = toIntOrNegInf(a.WorkoutID);
        const wB = toIntOrNegInf(b.WorkoutID);
        if (wA !== wB) return wB - wA;
      
        // 3) SetID desc (higher sets first)
        const sA = toIntOrNegInf(a.SetID);
        const sB = toIntOrNegInf(b.SetID);
        if (sA !== sB) return sB - sA;
      
        // 4) Final stable-ish fallback
        return norm(b.Exercise).localeCompare(norm(a.Exercise));
    });


      summarize(list);

      document.getElementById("results").innerHTML =
        list.slice(0, 50).map(formatEntry).join("") ||
        `<div class="muted" style="margin-top:10px;">No matches.</div>`;
    }

    async function init() {
      const res = await fetch("logs.csv", { cache: "no-store" });
      const text = await res.text();
      const rows = parseCSV(text);
      if (!rows.length) throw new Error("CSV empty");

      const header = rows[0].map(normKey);
      const idx = (name) => header.indexOf(normKey(name));

      const required = ["WorkoutID","Date","WorkoutLabel","SetID","Exercise","Weight_kg","Reps","NoteA","NoteB"];
      for (const col of required) {
        if (idx(col) === -1) throw new Error(`Missing column: ${col}`);
      }

      entries = rows.slice(1).map(r => ({
        WorkoutID: norm(r[idx("WorkoutID")]),
        Date: norm(r[idx("Date")]),
        WorkoutLabel: norm(r[idx("WorkoutLabel")]),
        SetID: norm(r[idx("SetID")]),
        Exercise: norm(r[idx("Exercise")]),
        Weight_kg: norm(r[idx("Weight_kg")]),
        Reps: norm(r[idx("Reps")]),
        NoteA: norm(r[idx("NoteA")]),
        NoteB: norm(r[idx("NoteB")]),
      })).filter(e => e.Exercise);

      renderExerciseOptions();
      renderNoteAOptions();
      applyFilter();

      document.getElementById("q").addEventListener("input", () => {
        document.getElementById("exerciseSelect").value = "";
        applyFilter();
      });

      document.getElementById("exerciseSelect").addEventListener("change", () => {
        document.getElementById("q").value = "";
        applyFilter();
      });

      document.getElementById("noteASelect").addEventListener("change", applyFilter);
    }

    init().catch(err => {
      document.getElementById("results").innerHTML =
        `<div class="muted">Failed to load logs.csv: ${escapeHtml(String(err))}</div>`;
    });
  </script>
</body>
</html>
